[project]
name = "codesmells"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alejandro Piad", email = "apiad@apiad.net" }
]
requires-python = ">=3.13"
dependencies = [
    "microcli-toolkit>=0.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
codesmells = "codesmells:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codesmells"]

[tool.hatch.build.targets.wheel.force-include]
"src/codesmells/library" = "codesmells/library"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.7",
]
